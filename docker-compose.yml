services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wasel}
      POSTGRES_USER: ${POSTGRES_USER:-wasel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wasel} -d ${POSTGRES_DB:-wasel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: [uploads_data:/app/uploads]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [internal]
volumes:
  postgres_data:
  uploads_data:
networks:
  internal:
    driver: bridge

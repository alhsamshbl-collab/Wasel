name: Wasel CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: wasel-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-tests:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
  android-build:
    name: Flutter Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: mobile
        run: flutter create --no-pub --platforms=android --project-name wasel .
      - name: Set official Wasel launcher icon
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Android manifest not found")
          source = manifest.read_text()
          source, count = re.subn(r'android:icon="[^"]+"', 'android:icon="@drawable/wasel_launcher"', source, count=1)
          if count == 0:
              raise SystemExit("Could not find android:icon in manifest")
          manifest.write_text(source)
          icon = Path("android/app/src/main/res/drawable/wasel_launcher.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#06131D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#19D6E5" android:pathData="M19,22C19,18.7 21.7,16 25,16h43c3.3,0 6,2.7 6,6v31c0,3.3 -2.7,6 -6,6h-25L25,74V59c-3.3,0 -6,-2.7 -6,-6z"/>
              <path android:fillColor="#53E7ED" android:pathData="M43,39h40c3.3,0 6,2.7 6,6v25c0,3.3 -2.7,6 -6,6h-2v15L65,76H43c-3.3,0 -6,-2.7 -6,-6V45c0,-3.3 2.7,-6 6,-6z"/>
          </vector>
          """)
          print("Installed custom Wasel chat-bubble launcher icon")
          PY
      - name: Stabilize Android text input and rendering
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          pattern = r'<activity\b([^>]*android:name="[^"]*MainActivity"[^>]*)>'
          def update_activity(match):
              attrs = re.sub(r'\sandroid:windowSoftInputMode="[^"]*"', '', match.group(1))
              return '<activity' + attrs + ' android:windowSoftInputMode="adjustResize">'
          source, count = re.subn(pattern, update_activity, source, count=1, flags=re.S)
          if count == 0:
              raise SystemExit("Could not find MainActivity in Android manifest")
          meta = '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />'
          if 'io.flutter.embedding.android.EnableImpeller' not in source:
              source = source.replace('</application>', '        ' + meta + '\n    </application>')
          manifest.write_text(source)
          print("Disabled Impeller for device compatibility and set adjustResize for keyboard")
          PY
      - name: Set Android compile SDK for current plugins
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              # Flutter templates vary: compileSdk, compileSdkVersion, Groovy or Kotlin DSL.
              updated, count = re.subn(
                  r"(?m)^(\s*)(compileSdk(?:Version)?)(\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)",
                  r"\g<1>\g<2>\g<3>36",
                  text,
              )
              if count:
                  path.write_text(updated)
                  print(f"Updated {path}: compileSdk=36")
                  found = True
          if not found:
              raise SystemExit("Could not find compileSdk/compileSdkVersion in generated Android app Gradle files")
          PY
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Normalize Android SDK for app and plugins
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.name not in ("build.gradle", "build.gradle.kts"):
                      continue
                  try:
                      source = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated, count = re.subn(
                      r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)",
                      r"\g<1>36",
                      source,
                  )
                  if count and updated != source:
                      path.write_text(updated)
                      changed += 1
                      print(f"Set compileSdk=36: {path}")
          if changed == 0:
              raise SystemExit("No Android Gradle compileSdk settings found to normalize")
          print(f"Updated {changed} Gradle file(s)")
          PY
      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart
      - name: Analyze Dart code
        working-directory: mobile
        run: flutter analyze
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://wasel-api-wg8v.onrender.com
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wasel-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

name: Wasel CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: wasel-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-tests:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
  android-build:
    name: Flutter Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: mobile
        run: flutter create --no-pub --platforms=android --project-name wasel .
      - name: Set Android compile SDK for current plugins
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              # Flutter templates vary: compileSdk, compileSdkVersion, Groovy or Kotlin DSL.
              updated, count = re.subn(
                  r"(?m)^(\s*)(compileSdk(?:Version)?)(\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)",
                  r"\g<1>\g<2>\g<3>36",
                  text,
              )
              if count:
                  path.write_text(updated)
                  print(f"Updated {path}: compileSdk=36")
                  found = True
          if not found:
              raise SystemExit("Could not find compileSdk/compileSdkVersion in generated Android app Gradle files")
          PY
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart
      - name: Analyze Dart code
        working-directory: mobile
        run: flutter analyze
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://wasel-api-wg8v.onrender.com
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wasel-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
